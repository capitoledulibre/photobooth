services:
    django:
        build: .
        environment:
        - DJANGO_SETTINGS_MODULE=photobooth.settings.production
        - DJANGO_DATABASE_PASSWORD
        # Photo overlay, see "Photo overlay" in the README. Variables left
        # unset in the shell or in .env keep their default.
        - PHOTOBOOTH_FRAME_TEXT
        - PHOTOBOOTH_FRAME_COLOR
        - PHOTOBOOTH_FRAME_LOGO
        - PHOTOBOOTH_FRAME_LOGO_COLOR
        volumes:
        - media:/srv/app/media
        # Put a custom logo in ./branding and set
        # PHOTOBOOTH_FRAME_LOGO=/srv/app/branding/<file>.png
        - ./branding:/srv/app/branding:ro
        ports:
        - 8005:8000
        restart: unless-stopped
    celery:
        build: .
        command: ["/srv/app/deploy/run-celery.sh"]
        environment:
        - DJANGO_SETTINGS_MODULE=photobooth.settings.production
        - DJANGO_DATABASE_PASSWORD
        volumes:
        - media:/srv/app/media
        - ./ssh:/home/daemon/.ssh
        restart: unless-stopped
    rabbitmq:
        image: rabbitmq
        restart: unless-stopped
    postgresql:
        image: postgres:18
        environment:
            - POSTGRES_USER=photobooth_user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=photobooth
        restart: unless-stopped

volumes:
  media: {}
