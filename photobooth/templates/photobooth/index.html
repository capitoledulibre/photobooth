<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <title>Photobooth Capitole du Libre</title>
</head>

<body id="snapWindow">
  <canvas style="display: none" id="Bigcanvas" class="border"></canvas>
  <video id="video" autoplay></video>
  <p id="debounce" class="snapAndDebounce">Appuyez sur le buzzer pour prendre une photo</p>
  <div id="secondScreenContainer">
    <div id="title" class="mx-auto">
      <img width="100%" src="/static/img/logo-capitoledulibre.png" />
    </div>
    <div class="mx-auto videos">
      <img id="imgResult" width="100%" src="" />
    </div>
    <div id="formContainer" class="mx-auto">
      <div class="container text-center">
        <h2 class="qrcodeText">Scanner un QR code pour Télécharger votre photo.</h2>
        <div class="row">
          <div class="col">
            <h4 class="qrcodeText">Sans contour</h4>
            <img id='qrcode' src="" alt="QR Code en cours de chargement..." class="center" width="300" height="300" />
          </div>
          <div class="col">
            <h4 class="qrcodeText">Avec contour</h4>
            <img id='qrcode_background' src="" alt="QR Code en cours de chargement..." class="center" width="300" height="300" />
          </div>
        </div>
        <h4 id="debounceEnd"></h4>
      </div>
    </div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/index.js"></script>
</body>

</html>
