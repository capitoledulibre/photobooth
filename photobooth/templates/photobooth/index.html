<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <!-- No favicon: avoids a useless 404 on every page load. -->
  <link rel="icon" href="data:," />
  <title>Photobooth Capitole du Libre</title>
</head>

<body data-state="starting">
  <!-- Live camera preview, mirrored like a mirror (the photo itself is not). -->
  <video id="preview" autoplay muted playsinline></video>

  <div id="overlay" aria-live="assertive">
    <p id="message">Démarrage de la caméra…</p>
    <p id="hint"></p>
  </div>

  <div id="flash"></div>

  <main id="result">
    <img class="logo" src="/static/img/logo-capitoledulibre.png" alt="Capitole du Libre" />

    <div class="frame">
      <!-- Freeze frame shown right away, replaced by the framed photo once the
           server has generated it. -->
      <canvas id="capture"></canvas>
      <img id="photo" alt="Votre photo" />
    </div>

    <aside id="download" data-status="uploading" aria-live="polite">
      <h2>Scannez pour télécharger votre photo</h2>
      <p class="status status-uploading"><span class="spinner"></span>Enregistrement de la photo…</p>
      <p class="status status-pending"><span class="spinner"></span>Mise en ligne de la photo…</p>
      <p class="status status-unavailable">Le téléchargement n'est pas disponible pour le moment, désolé.</p>
      <div class="qrcodes">
        <figure>
          <img id="qrcode" alt="QR code de la photo sans contour" />
          <figcaption>Sans contour</figcaption>
        </figure>
        <figure>
          <img id="qrcode-background" alt="QR code de la photo avec contour" />
          <figcaption>Avec contour</figcaption>
        </figure>
      </div>
    </aside>

    <p id="countdown-end"></p>
  </main>

  <script src="/static/js/index.js"></script>
</body>

</html>
