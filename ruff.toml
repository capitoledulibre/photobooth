# Assume Python 3.12
target-version = "py312"

# Same as Black.
line-length = 88
indent-width = 4

exclude = [
    ".tox/*",
    ".git/*",
    "photobooth/settings/*",
]

[lint.per-file-ignores]
# Django auto-generates migrations; their class attributes are mutable by design.
"photobooth/migrations/*" = ["RUF012"]
